openapi: 3.1.0
info:
  title: Pchinese F02 Profile Preferences API
  version: 1.0.0-design
  description: >
    Design contract for F02. Public paths are served below /api/v1 and use the
    standard success/data/error/meta envelope.
servers:
  - url: /api/v1
tags:
  - name: Profile
  - name: Admin Audit
paths:
  /me:
    get:
      tags: [Profile]
      summary: Read the canonical current-user profile projection
      operationId: getCurrentUser
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CurrentUserEnvelope' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
    patch:
      tags: [Profile]
      summary: Update approved caller preferences and return the canonical current-user profile projection
      operationId: updateCurrentUserProfile
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProfileUpdateRequest' }
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CurrentUserEnvelope' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '409': { $ref: '#/components/responses/StateConflict' }
  /admin/audit-events:
    get:
      tags: [Admin Audit]
      summary: Read the ADMIN-only safe system activity history
      description: >
        Returns only the minimized public projection of internally structured audit events.
        Source records use an approved category/type and bounded safe outcome, reason or
        changed-field codes, but no audit metadata beyond the fields defined by this response
        is exposed to ADMIN clients.
      operationId: listAdminAuditEvents
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminAuditPageEnvelope' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    ValidationError:
      description: Safe input validation error
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    Unauthenticated:
      description: Missing, expired, revoked or invalid credential
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    Forbidden:
      description: Authenticated caller lacks the server-authorized ADMIN role
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    StateConflict:
      description: Current state or version rejects the requested transition
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
  parameters:
    Page:
      name: page
      in: query
      required: false
      schema: { type: integer, minimum: 0, default: 0 }
    PageSize:
      name: size
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
  schemas:
    ProfileUpdateRequest:
      type: object
      required: [expectedProfileVersion]
      properties:
        displayName: { type: string, minLength: 1, maxLength: 120 }
        nativeLanguageCode: { type: string, minLength: 2, maxLength: 10 }
        interfaceLocale: { type: string, minLength: 2, maxLength: 16 }
        timeZone: { type: string, minLength: 1, maxLength: 64 }
        targetHskLevel: { type: integer, minimum: 1, maximum: 6 }
        dailyGoalMinutes: { type: integer, minimum: 1, maximum: 240 }
        expectedProfileVersion: { type: integer, minimum: 0 }
      additionalProperties: false
    Profile:
      type: object
      required: [profileVersion]
      properties:
        displayName: { type: string }
        nativeLanguageCode: { type: string }
        interfaceLocale: { type: string }
        timeZone: { type: string }
        targetHskLevel: { type: integer }
        dailyGoalMinutes: { type: integer }
        profileVersion: { type: integer, minimum: 0 }
    CurrentUserProjection:
      description: Canonical F02 GET and PATCH /me projection. F03 later extends this route with the entitlement fragment.
      type: object
      required: [profile]
      properties:
        profile: { $ref: '#/components/schemas/Profile' }
    AdminAuditEvent:
      description: >
        A minimized system event visible only to ADMIN. The source record is organized by an
        approved category and event type; private outcome/reason/changed-field codes and
        request/session trace are intentionally not serialized here.
      type: object
      required: [eventType, actorAccountName, targetAccountName, occurredAt]
      properties:
        eventType:
          type: string
          description: Approved public event type; its internal category is not serialized.
          enum: [LOGIN, EMAIL_VERIFIED, PASSWORD_RESET, PROFILE_PREFERENCES_UPDATED, ROLE_GRANTED, ROLE_REVOKED, ACCOUNT_LOCKED, ACCOUNT_UNLOCKED, SECURITY_EVENT]
        occurredAt: { type: string, format: date-time }
        actorAccountName: { type: string, maxLength: 120 }
        targetAccountName: { type: string, maxLength: 120 }
    AdminAuditPage:
      type: object
      required: [items, page, size, totalItems, totalPages]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/AdminAuditEvent' }
        page: { type: integer, minimum: 0 }
        size: { type: integer, minimum: 1, maximum: 50 }
        totalItems: { type: integer, minimum: 0 }
        totalPages: { type: integer, minimum: 0 }
    Meta:
      type: object
      required: [correlationId]
      properties:
        correlationId: { type: string, format: uuid }
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          enum: [VALIDATION_ERROR, UNAUTHENTICATED, AUTHORIZATION_DENIED, RESOURCE_NOT_FOUND, STATE_CONFLICT]
        message: { type: string }
    CurrentUserEnvelope:
      type: object
      required: [success, data, error, meta]
      properties:
        success: { const: true }
        data: { $ref: '#/components/schemas/CurrentUserProjection' }
        error: { type: 'null' }
        meta: { $ref: '#/components/schemas/Meta' }
    AdminAuditPageEnvelope:
      type: object
      required: [success, data, error, meta]
      properties:
        success: { const: true }
        data: { $ref: '#/components/schemas/AdminAuditPage' }
        error: { type: 'null' }
        meta: { $ref: '#/components/schemas/Meta' }
    ErrorEnvelope:
      type: object
      required: [success, data, error, meta]
      properties:
        success: { const: false }
        data: { type: 'null' }
        error: { $ref: '#/components/schemas/Error' }
        meta: { $ref: '#/components/schemas/Meta' }
security:
  - bearerAuth: []
