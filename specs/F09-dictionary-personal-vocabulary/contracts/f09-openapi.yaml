openapi: 3.1.0
info:
  title: Pchinese F09 Dictionary and Personal Vocabulary API
  version: 1.1.0-design
  description: >
    Contract for public PUBLISHED dictionary discovery and authenticated,
    caller-owned personal vocabulary. The server owns publication visibility,
    normalization, ranking, plan capacity, note conflicts and F10 coordination.
servers:
  - url: /api/v1
tags:
  - name: Dictionary
  - name: PersonalVocabulary
paths:
  /dictionary:
    get:
      tags: [Dictionary]
      summary: Search published dictionary entries
      operationId: searchDictionary
      security: []
      parameters:
        - name: query
          in: query
          required: true
          description: Trimmed input must contain 1–120 Unicode code points before server normalization.
          schema: { type: string, minLength: 1, maxLength: 120 }
        - name: hskLevel
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 6 }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: A bounded page of only current published summaries; an empty page is a valid result.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DictionaryListEnvelope' }
        '400': { $ref: '#/components/responses/ValidationError' }
  /dictionary/{entryId}:
    get:
      tags: [Dictionary]
      summary: Read one current published dictionary entry
      operationId: getDictionaryEntry
      security: []
      parameters: [ { $ref: '#/components/parameters/EntryId' } ]
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DictionaryEntryEnvelope' }
        '404': { $ref: '#/components/responses/NotFound' }
  /saved-words:
    post:
      tags: [PersonalVocabulary]
      summary: Create or restore one caller-owned saved word
      operationId: saveWord
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SaveWordRequest' }
      responses:
        '200':
          description: An existing active relation or a restored relation.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SaveWordEnvelope' }
        '201':
          description: A new saved-word relation. F10 initial schedule creation is internal.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SaveWordEnvelope' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
    get:
      tags: [PersonalVocabulary]
      summary: List caller-owned vocabulary
      operationId: listSavedWords
      parameters:
        - name: status
          in: query
          required: false
          schema: { type: string, enum: [ACTIVE, DELETED], default: ACTIVE }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SavedWordListEnvelope' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
  /saved-words/{savedWordId}:
    get:
      tags: [PersonalVocabulary]
      summary: Read one caller-owned saved word for a reload after a conflict
      operationId: getSavedWord
      parameters: [ { $ref: '#/components/parameters/SavedWordId' } ]
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SavedWordEnvelope' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [PersonalVocabulary]
      summary: Update a caller-owned personal note using its current version
      operationId: updateSavedWordNote
      parameters: [ { $ref: '#/components/parameters/SavedWordId' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateSavedWordNoteRequest' }
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SavedWordEnvelope' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/StateConflict' }
    delete:
      tags: [PersonalVocabulary]
      summary: Remove a saved word from active vocabulary
      operationId: deleteSavedWord
      parameters: [ { $ref: '#/components/parameters/SavedWordId' } ]
      responses:
        '200': { $ref: '#/components/responses/EmptySuccess' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
  parameters:
    EntryId: { name: entryId, in: path, required: true, schema: { type: string, format: uuid } }
    SavedWordId: { name: savedWordId, in: path, required: true, schema: { type: string, format: uuid } }
    Page: { name: page, in: query, required: false, schema: { type: integer, minimum: 0, default: 0 } }
    Size: { name: size, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
  responses:
    EmptySuccess:
      description: Command accepted and completed without revealing removed shared content.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/EmptySuccessEnvelope' }
    ValidationError:
      description: Invalid query, filter, pagination, identifier, note or expected version.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    Unauthenticated:
      description: Missing, expired, revoked or invalid access credential.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    NotFound:
      description: A public entry is absent/unpublished, or a saved word is absent/unowned.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    StateConflict:
      description: The submitted note version is stale. Reload the owner resource before editing again.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
  schemas:
    DictionarySummary:
      type: object
      required: [id, simplified, pinyin, vietnameseGloss]
      properties:
        id: { type: string, format: uuid }
        simplified: { type: string }
        traditional: { type: [string, 'null'] }
        pinyin: { type: string }
        vietnameseGloss: { type: string }
        hskLevel: { type: [integer, 'null'], minimum: 1, maximum: 6 }
    DictionaryExample:
      type: object
      required: [hanzi, pinyin, vietnameseMeaning]
      properties:
        hanzi: { type: string }
        pinyin: { type: string }
        vietnameseMeaning: { type: string }
    DictionaryEntry:
      allOf:
        - $ref: '#/components/schemas/DictionarySummary'
        - type: object
          required: [senses, examples, audio, image]
          properties:
            senses: { type: array, minItems: 1, items: { type: string } }
            examples: { type: array, items: { $ref: '#/components/schemas/DictionaryExample' } }
            audio: { type: [object, 'null'], description: Present only for a published and available F04 asset. }
            image: { type: [object, 'null'], description: Present only for a published and available F04 asset. }
    SaveWordRequest:
      type: object
      required: [dictionaryEntryId]
      properties:
        dictionaryEntryId: { type: string, format: uuid }
      additionalProperties: false
    UpdateSavedWordNoteRequest:
      type: object
      required: [personalNote, expectedVersion]
      properties:
        personalNote: { type: [string, 'null'], maxLength: 500, description: A plain-text note, or null to clear it. }
        expectedVersion: { type: integer, minimum: 0 }
      additionalProperties: false
    SavedWord:
      type: object
      required: [id, dictionaryEntryId, status, savedAt, version, personalNote, unavailable, dictionary]
      properties:
        id: { type: string, format: uuid }
        dictionaryEntryId: { type: string, format: uuid }
        status: { type: string, enum: [ACTIVE, DELETED] }
        savedAt: { type: string, format: date-time, description: Initial-save or restoration time used for vocabulary recency. }
        version: { type: integer, minimum: 0 }
        personalNote: { type: [string, 'null'], maxLength: 500 }
        unavailable: { type: boolean }
        dictionary:
          oneOf:
            - $ref: '#/components/schemas/DictionarySummary'
            - type: 'null'
          description: Null when the source entry is no longer published; withdrawn detail is never included.
    SaveWordResult:
      type: object
      required: [savedWord, activeCount, capacity, autoRemovedSavedWordId]
      properties:
        savedWord: { $ref: '#/components/schemas/SavedWord' }
        activeCount: { type: integer, minimum: 0 }
        capacity:
          oneOf:
            - type: integer
              const: 20
            - type: 'null'
          description: Null denotes an active Premium entitlement; it is display data, never client authority.
        autoRemovedSavedWordId:
          oneOf:
            - type: string
              format: uuid
            - type: 'null'
          description: The record automatically moved to DELETED to make room for a full Free vocabulary, if any.
    PageMeta:
      type: object
      required: [correlationId, page, size]
      properties:
        correlationId: { type: string, format: uuid }
        page: { type: integer, minimum: 0 }
        size: { type: integer, minimum: 1, maximum: 50 }
    VocabularyPageMeta:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [activeCount, capacity]
          properties:
            activeCount: { type: integer, minimum: 0 }
            capacity:
              oneOf:
                - type: integer
                  const: 20
                - type: 'null'
    Meta:
      type: object
      required: [correlationId]
      properties:
        correlationId: { type: string, format: uuid }
    Error:
      type: object
      required: [code, message]
      properties:
        code: { type: string, enum: [VALIDATION_ERROR, UNAUTHENTICATED, RESOURCE_NOT_FOUND, STATE_CONFLICT] }
        message: { type: string }
    DictionaryListEnvelope:
      type: object
      required: [success, data, error, meta]
      properties:
        success: { const: true }
        data: { type: array, maxItems: 50, items: { $ref: '#/components/schemas/DictionarySummary' } }
        error: { type: 'null' }
        meta: { $ref: '#/components/schemas/PageMeta' }
    DictionaryEntryEnvelope:
      type: object
      required: [success, data, error, meta]
      properties:
        success: { const: true }
        data: { $ref: '#/components/schemas/DictionaryEntry' }
        error: { type: 'null' }
        meta: { $ref: '#/components/schemas/Meta' }
    SaveWordEnvelope:
      type: object
      required: [success, data, error, meta]
      properties:
        success: { const: true }
        data: { $ref: '#/components/schemas/SaveWordResult' }
        error: { type: 'null' }
        meta: { $ref: '#/components/schemas/Meta' }
    SavedWordEnvelope:
      type: object
      required: [success, data, error, meta]
      properties:
        success: { const: true }
        data: { $ref: '#/components/schemas/SavedWord' }
        error: { type: 'null' }
        meta: { $ref: '#/components/schemas/Meta' }
    SavedWordListEnvelope:
      type: object
      required: [success, data, error, meta]
      properties:
        success: { const: true }
        data: { type: array, maxItems: 50, items: { $ref: '#/components/schemas/SavedWord' } }
        error: { type: 'null' }
        meta: { $ref: '#/components/schemas/VocabularyPageMeta' }
    EmptySuccessEnvelope:
      type: object
      required: [success, data, error, meta]
      properties:
        success: { const: true }
        data: { type: 'null' }
        error: { type: 'null' }
        meta: { $ref: '#/components/schemas/Meta' }
    ErrorEnvelope:
      type: object
      required: [success, data, error, meta]
      properties:
        success: { const: false }
        data: { type: 'null' }
        error: { $ref: '#/components/schemas/Error' }
        meta: { $ref: '#/components/schemas/Meta' }
security:
  - bearerAuth: []
x-internal-domain-contract:
  f04SearchProjection:
    callers: [F04-content-administration]
    operations: [rebuildKeysForEntry, removeKeysForEntry]
    invariant: Current dictionary entry publication state is checked again by every public read.
  f10ScheduleLifecycle:
    callers: [F09-dictionary-personal-vocabulary]
    operations: [ensureInitialSchedule, suspendSchedule, restoreSchedule]
    invariant: F09 never accesses F10 repositories or tables directly.
  f03PremiumExpiry:
    callers: [F03-plans-entitlement-ai-allowance]
    operation: enforceFreeVocabularyCapacity
    input: [userId, transitionTime]
    invariant: F03 establishes the effective Free entitlement and F09/F10 trimming commits in the same transaction.
