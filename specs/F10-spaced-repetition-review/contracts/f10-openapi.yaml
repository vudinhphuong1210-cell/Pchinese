openapi: 3.0.3
info:
  title: F10 Spaced Repetition Review API
  version: 1.0.0
  description: Public REST API for due queue retrieval, rating submission, and review history.
paths:
  /api/v1/srs/due:
    get:
      summary: Retrieve due review queue for authenticated learner
      description: Returns at most 20 learner-owned due review cards where due_at <= now(), ordered by due_at ASC.
      security:
        - BearerAuth: []
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 20
            maximum: 20
            minimum: 1
      responses:
        '200':
          description: Due queue retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      items:
                        type: array
                        items:
                          $ref: '#/components/schemas/DueReviewCardResponse'
                      totalDueCount:
                        type: integer
                        example: 5
                  meta:
                    type: object

  /api/v1/srs/review:
    post:
      summary: Submit a review rating for a due schedule
      description: Atomically updates next due state, inserts review event, and handles client idempotency.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitReviewRequest'
      responses:
        '200':
          description: Review submitted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/SubmitReviewResponse'
        '400':
          description: Validation error or invalid rating
        '404':
          description: Schedule not found or not owned
        '409':
          description: State conflict or stale schedule version

components:
  schemas:
    DueReviewCardResponse:
      type: object
      properties:
        srsScheduleId:
          type: string
          format: uuid
        savedWordId:
          type: string
          format: uuid
        dictionaryEntryId:
          type: string
          format: uuid
        simplifiedHanzi:
          type: string
        traditionalHanzi:
          type: string
        primaryPinyin:
          type: string
        hskLevel:
          type: integer
        wordType:
          type: string
        senses:
          type: string
        audioMediaAssetId:
          type: string
          format: uuid
        personalNotePlaintext:
          type: string
        status:
          type: string
          enum: [LEARNING, REVIEW, RELEARNING, SUSPENDED]
        dueAt:
          type: string
          format: date-time
        intervalDays:
          type: number
        easeFactor:
          type: number
        scheduleVersion:
          type: integer
          format: int64

    SubmitReviewRequest:
      type: object
      required:
        - srsScheduleId
        - clientReviewId
        - rating
        - expectedScheduleVersion
      properties:
        srsScheduleId:
          type: string
          format: uuid
        clientReviewId:
          type: string
          format: uuid
        rating:
          type: string
          enum: [AGAIN, HARD, GOOD, EASY]
        expectedScheduleVersion:
          type: integer
          format: int64

    SubmitReviewResponse:
      type: object
      properties:
        srsScheduleId:
          type: string
          format: uuid
        srsReviewEventId:
          type: string
          format: uuid
        clientReviewId:
          type: string
          format: uuid
        rating:
          type: string
        previousStatus:
          type: string
        nextStatus:
          type: string
        previousDueAt:
          type: string
          format: date-time
        nextDueAt:
          type: string
          format: date-time
        previousIntervalDays:
          type: number
        nextIntervalDays:
          type: number
        easeFactor:
          type: number
        newScheduleVersion:
          type: integer
          format: int64
        idempotentReplay:
          type: boolean
