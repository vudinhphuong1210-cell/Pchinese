openapi: 3.1.0
info:
  title: Pchinese F02 Profile and Session Control API
  version: 1.0.0-design
  description: >
    Design contract for F02. Public paths are served below /api/v1 and use the
    standard success/data/error/meta envelope. The restricted session-management
    flow is a transient credential, not a browser session or an access JWT.
servers:
  - url: /api/v1
tags:
  - name: Profile
  - name: Sessions
  - name: RestrictedSessionManagement
paths:
  /me:
    get:
      tags: [Profile]
      summary: Read the canonical current-user projection, including profile and safe entitlement summary
      operationId: getCurrentUser
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CurrentUserEnvelope' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
    patch:
      tags: [Profile]
      summary: Update approved caller preferences and return the canonical current-user projection
      operationId: updateCurrentUserProfile
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProfileUpdateRequest' }
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CurrentUserEnvelope' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '409': { $ref: '#/components/responses/StateConflict' }
  /auth/sessions:
    get:
      tags: [Sessions]
      summary: List privacy-safe active sessions owned by the caller
      operationId: listMySessions
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionListEnvelope' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
    delete:
      tags: [Sessions]
      summary: Revoke all sessions owned by the caller, including current
      operationId: revokeAllMySessions
      responses:
        '200': { $ref: '#/components/responses/EmptySuccess' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
  /auth/sessions/{sessionId}:
    delete:
      tags: [Sessions]
      summary: Revoke one owned session
      operationId: revokeMySession
      parameters:
        - $ref: '#/components/parameters/SessionId'
        - name: confirmCurrentSession
          in: query
          required: false
          schema: { type: boolean, default: false }
          description: Must be true when revoking the current session.
      responses:
        '200': { $ref: '#/components/responses/EmptySuccess' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/StateConflict' }
  /auth/session-management-flow/sessions:
    get:
      tags: [RestrictedSessionManagement]
      summary: List sessions available only to a device-limit management flow
      operationId: listFlowSessions
      security:
        - sessionManagementFlow: []
      responses:
        '200':
          description: Privacy-safe sessions for the verified login account only.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionListEnvelope' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
  /auth/session-management-flow/sessions/{sessionId}:
    delete:
      tags: [RestrictedSessionManagement]
      summary: Revoke one session through the one-purpose management flow
      operationId: revokeFlowSession
      security:
        - sessionManagementFlow: []
      parameters:
        - $ref: '#/components/parameters/SessionId'
      responses:
        '200':
          description: Session revoked; the flow ends and a fresh normal login is required.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmptySuccessEnvelope' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    sessionManagementFlow:
      type: apiKey
      in: header
      name: X-Session-Management-Flow
      description: >
        Opaque, short-lived, restricted credential. It cannot access profile,
        content, role or entitlement routes and must not be persisted by browser code.
  parameters:
    SessionId:
      name: sessionId
      in: path
      required: true
      schema: { type: string, format: uuid }
  responses:
    EmptySuccess:
      description: Command accepted and completed
      content:
        application/json:
          schema: { $ref: '#/components/schemas/EmptySuccessEnvelope' }
    ValidationError:
      description: Safe input validation error
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    Unauthenticated:
      description: Missing, expired, revoked or invalid credential
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    NotFound:
      description: Resource absent or not owned; no disclosure distinction
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    StateConflict:
      description: Current state or version rejects the requested transition
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
  schemas:
    ProfileUpdateRequest:
      type: object
      required: [expectedProfileVersion]
      properties:
        displayName: { type: string, minLength: 1, maxLength: 120 }
        nativeLanguageCode: { type: string, minLength: 2, maxLength: 10 }
        interfaceLocale: { type: string, minLength: 2, maxLength: 20 }
        timeZone: { type: string, minLength: 1, maxLength: 64 }
        targetHskLevel: { type: integer, minimum: 1, maximum: 9 }
        dailyGoalMinutes: { type: integer, minimum: 1, maximum: 240 }
        expectedProfileVersion: { type: integer, minimum: 0 }
      additionalProperties: false
    Profile:
      type: object
      required: [profileVersion]
      properties:
        displayName: { type: string }
        nativeLanguageCode: { type: string }
        interfaceLocale: { type: string }
        timeZone: { type: string }
        targetHskLevel: { type: integer }
        dailyGoalMinutes: { type: integer }
        profileVersion: { type: integer, minimum: 0 }
    EntitlementSummary:
      description: Safe learner-visible F03 entitlement fragment; this projection never exposes provider or payment data.
      type: object
      required: [planCode, allowanceLimit, usedUnits, remainingUnits, cycleStartAt, cycleEndAt]
      properties:
        planCode: { type: string, const: FREE }
        allowanceLimit: { type: integer, const: 30 }
        usedUnits: { type: integer, minimum: 0, maximum: 30 }
        remainingUnits: { type: integer, minimum: 0, maximum: 30 }
        cycleStartAt: { type: string, format: date-time }
        cycleEndAt: { type: string, format: date-time }
    CurrentUserProjection:
      description: Canonical GET and PATCH /me projection, composed by F02 with the safe F03 entitlement fragment.
      type: object
      required: [profile, entitlement]
      properties:
        profile: { $ref: '#/components/schemas/Profile' }
        entitlement: { $ref: '#/components/schemas/EntitlementSummary' }
    SessionProjection:
      type: object
      required: [sessionId, deviceLabel, platform, createdAt, lastSeenAt, currentSession]
      properties:
        sessionId: { type: string, format: uuid }
        deviceLabel: { type: string, maxLength: 120 }
        platform: { type: string, enum: [WEB, IOS, ANDROID] }
        createdAt: { type: string, format: date-time }
        lastSeenAt: { type: string, format: date-time }
        currentSession: { type: boolean }
    Meta:
      type: object
      required: [correlationId]
      properties:
        correlationId: { type: string, format: uuid }
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          enum: [VALIDATION_ERROR, UNAUTHENTICATED, RESOURCE_NOT_FOUND, STATE_CONFLICT]
        message: { type: string }
    CurrentUserEnvelope:
      type: object
      required: [success, data, error, meta]
      properties:
        success: { const: true }
        data: { $ref: '#/components/schemas/CurrentUserProjection' }
        error: { type: 'null' }
        meta: { $ref: '#/components/schemas/Meta' }
    SessionListEnvelope:
      type: object
      required: [success, data, error, meta]
      properties:
        success: { const: true }
        data:
          type: array
          items: { $ref: '#/components/schemas/SessionProjection' }
        error: { type: 'null' }
        meta: { $ref: '#/components/schemas/Meta' }
    EmptySuccessEnvelope:
      type: object
      required: [success, data, error, meta]
      properties:
        success: { const: true }
        data: { type: object }
        error: { type: 'null' }
        meta: { $ref: '#/components/schemas/Meta' }
    ErrorEnvelope:
      type: object
      required: [success, data, error, meta]
      properties:
        success: { const: false }
        data: { type: 'null' }
        error: { $ref: '#/components/schemas/Error' }
        meta: { $ref: '#/components/schemas/Meta' }
security:
  - bearerAuth: []
